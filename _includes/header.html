<header class="site-header">

  <h2 class="logo"><a href="{{ site.baseurl }}/">{{ site.title }}</a></h2>

  <div class="nav">
    
    <div class="site-nav">
      <nav>
        <ul class="page-link">
          {%- for path in site.header_pages -%}
            {%- assign my_page = site.pages | where: "path", path | first -%}
            {%- if my_page.title -%}
            <li><a href="{{ my_page.url | relative_url }}">{{ my_page.title | escape | downcase }}</a></li>
            {%- endif -%}
          {%- endfor -%}
        </ul>
      </nav>
    </div>

  </div>
</header>
